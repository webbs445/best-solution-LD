<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Section 4 · In one free consultation · phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Inter+Tight:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9A5A36}a:hover{color:#7A4428}
.bs-primary{display:flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:0 10px 0 24px;border-radius:14px;font-family:Inter,system-ui,sans-serif;font-size:16px;font-weight:600;text-decoration:none;background:#B9714B;color:#FFFFFF;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.bs-arrow{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.18);display:inline-flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width: 390px; height: 1260px; box-sizing: border-box; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #14213D; padding: 44px 20px; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #9A5A36">WHAT YOU WALK AWAY WITH</span>
<h2 style="margin: 0; font-family: 'Inter Tight', Inter, sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1; letter-spacing: -0.02em">In one free consultation, you'll know</h2>

<div style="background: #FBF6F1; border-radius: 22px; padding: 22px 16px; display: flex; justify-content: center">
<div style="width: 100%; background: #FFFFFF; border-radius: 10px; box-shadow: 0 24px 40px -28px rgba(20,33,61,0.45), 0 0 0 1px rgba(20,33,61,0.06); padding: 18px 18px; display: flex; flex-direction: column; gap: 8px; transform: rotate(-1deg)">
<div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 2px solid #14213D"><span style="font-weight: 700; font-size: 12px">best solution · Written plan</span><span style="font-size: 11px; color: #5B6375">For: [Your name]</span></div>
<span style="align-self: flex-start; font-size: 11px; font-weight: 600; color: #1F6B45; background: #E8F4EC; padding: 4px 8px; border-radius: 999px">✓ Sent within [1 working day]</span>
<div style="{{b0}}"><span style="font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; color: #9A5A36">1 · STRUCTURE</span><span style="width: 80%; height: 6px; border-radius: 3px; background: #F2EBE4"></span></div>
<div style="{{b1}}"><span style="font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; color: #9A5A36">2 · COSTS</span><span style="width: 66%; height: 6px; border-radius: 3px; background: #EDE4DB"></span></div>
<div style="{{b2}}"><span style="font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; color: #9A5A36">3 · WHAT TO PREPARE</span><span style="width: 72%; height: 6px; border-radius: 3px; background: #F2EBE4"></span></div>
<div style="{{b3}}"><span style="font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; color: #9A5A36">4 · TIMELINE</span><div style="display: flex; gap: 3px"><span style="flex: 2; height: 6px; border-radius: 3px; background: #B9714B"></span><span style="flex: 3; height: 6px; border-radius: 3px; background: #D8B79F"></span><span style="flex: 2; height: 6px; border-radius: 3px; background: #EBDCCF"></span></div></div>
<div style="{{b4}}"><span style="font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; color: #9A5A36">5 · OUR FEES</span><span style="width: 50%; height: 6px; border-radius: 3px; background: #EDE4DB"></span></div>
</div>
</div>

<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<button type="button" aria-pressed="{{r.pressed}}" onClick="{{r.pick}}" style="{{r.style}}"><span style="{{r.numStyle}}">{{r.num}}</span><span style="display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-size: 16px; font-weight: 700">{{r.title}}</span><span style="font-size: 14px; color: #5B6375">{{r.sub}}</span></span></button>
</sc-for>
<a href="#" class="bs-primary" style="margin-top: 6px">Get my free plan <span class="bs-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span></a>
<span style="font-size: 13px; color: #5B6375; text-align: center">No pressure to buy. If we're not the right fit, we'll tell you.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1260}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { hov: 0 }; }
  renderVals() {
    var data = [
      { title: "Which structure fits", sub: "and why the others don't" },
      { title: "What it costs", sub: "year one, and every year after" },
      { title: "What to prepare", sub: "as a simple checklist" },
      { title: "How long it takes", sub: "realistically, step by step" },
      { title: "What our help costs", sub: "in writing, before any work" }
    ];
    var h = this.state.hov, self = this;
    var rows = data.map(function (d, i) {
      var on = i === h;
      return {
        num: String(i + 1), title: d.title, sub: d.sub, pressed: on ? "true" : "false",
        pick: function () { self.setState({ hov: i }); },
        style: "display: flex; align-items: center; gap: 14px; width: 100%; font-family: inherit; color: #14213D; cursor: pointer; padding: 12px 14px; border-radius: 14px; min-height: 60px; " + (on ? "background: #FBF1EA; border: 1.5px solid #D8B79F;" : "background: transparent; border: 1.5px solid #F0E8E0;"),
        numStyle: "flex: none; width: 36px; height: 36px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-family: 'Inter Tight', Inter, sans-serif; font-size: 16px; font-weight: 800; " + (on ? "background: #B9714B; color: #FFFFFF;" : "background: #F3E4D8; color: #9A5A36;")
      };
    });
    var blk = function (i) { return "display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; margin: 0 -10px; border-radius: 8px; transition: background .25s, box-shadow .25s; " + (i === h ? "background: #FBF1EA; box-shadow: inset 0 0 0 2px #B9714B;" : "background: transparent;"); };
    return { rows: rows, b0: blk(0), b1: blk(1), b2: blk(2), b3: blk(3), b4: blk(4) };
  }
}
</script>
</body>
</html>
