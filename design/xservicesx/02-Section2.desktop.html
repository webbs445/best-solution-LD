<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Section 2 · Sound familiar?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Inter+Tight:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9A5A36}a:hover{color:#7A4428}
@keyframes bsIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bsGlow{0%{background:rgba(227,164,126,0.28)}100%{background:rgba(227,164,126,0)}}
</style>
</helmet>
<div style="width: 1440px; height: 780px; box-sizing: border-box; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #14213D; padding: 80px 120px; display: grid; grid-template-columns: 600px 1fr; gap: 64px; align-items: center">

<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; color: #B9714B">SOUND FAMILIAR?</span>
<h2 style="margin: 0; font-family: 'Inter Tight', Inter, sans-serif; font-weight: 800; font-size: 44px; line-height: 1.08; letter-spacing: -0.02em">Which of these is on your mind?</h2>
<p style="margin: 0 0 10px; font-size: 17px; color: #5B6375">Tap all that apply. We'll show you how we answer them.</p>
<sc-for list="{{worries}}" as="w" hint-placeholder-count="5">
<button type="button" aria-pressed="{{w.pressed}}" onClick="{{w.toggle}}" style="{{w.style}}"><span style="{{w.boxStyle}}"><sc-if value="{{w.on}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></sc-if></span><span style="font-size: 17px; line-height: 1.4; text-align: left">{{w.text}}</span></button>
</sc-for>
</div>

<div style="background: #14213D; color: #FFFFFF; border-radius: 28px; padding: 40px 44px; display: flex; flex-direction: column; gap: 18px; min-height: 560px; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 12px"><div style="width: 44px; height: 44px; border-radius: 50%; background: #2A3A5E; border: 2px solid #E3A47E; flex: none; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #E3A47E; font-weight: 600">Photo</div><span style="font-size: 14px; color: #C3CAD8">[Advisor name] answers these every day</span></div>
<h3 style="margin: 0 0 4px; font-family: 'Inter Tight', Inter, sans-serif; font-weight: 800; font-size: 30px; line-height: 1.15">{{heading}} <span style="color: #E3A47E">in one free conversation.</span></h3>
<sc-for list="{{answers}}" as="a" hint-placeholder-count="4">
<div style="{{a.style}}"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #B9714B; display: inline-flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></span><span style="font-size: 17px; line-height: 1.5; color: #E6EAF1"><span style="font-weight: 700; color: #FFFFFF">{{a.lead}}</span> {{a.rest}}</span></div>
</sc-for>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 8px">
<a href="#" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; background: #B9714B; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 700; padding: 16px 24px; border-radius: 14px">{{cta}} <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a>
<span style="font-size: 14px; color: #A9B2C3">Free · one conversation · answers in writing</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":780}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: [], last: -1 }; }
  renderVals() {
    var data = [
      { text: "Three consultants gave me three different prices. Which one is right?", lead: "One clear cost, in writing,", rest: "so you can compare it with any quote you already have." },
      { text: "Free zone or mainland? I've read ten articles and I'm still not sure.", lead: "Free zone or mainland, decided with you,", rest: "based on your activity and your customers." },
      { text: "Does a free zone even allow my activity?", lead: "Your activity checked", rest: "against the zones that allow it, before you pay anything." },
      { text: "What costs show up in year two that nobody mentioned?", lead: "Year one and every year after,", rest: "shown upfront, before you commit." },
      { text: "Something else. I'll tell the advisor.", lead: "Tell us in your own words,", rest: "in the form or on WhatsApp, and an advisor gives you a clear answer." }
    ];
    var picked = this.state.picked, last = this.state.last, self = this;
    var worries = data.map(function (d, i) {
      var on = picked.indexOf(i) !== -1;
      return {
        text: d.text, on: on, pressed: on ? "true" : "false",
        toggle: function () {
          var p = self.state.picked.slice();
          var k = p.indexOf(i);
          if (k === -1) { p.push(i); self.setState({ picked: p, last: i }); }
          else { p.splice(k, 1); self.setState({ picked: p, last: -1 }); }
        },
        style: "display: flex; align-items: center; gap: 16px; width: 100%; font-family: inherit; color: #14213D; cursor: pointer; padding: 16px 20px; border-radius: 16px; min-height: 60px; transition: background .2s, border-color .2s; " + (on ? "background: #FBF1EA; border: 2px solid #B9714B;" : "background: #FFFFFF; border: 1.5px solid #E7DCD2;"),
        boxStyle: "flex: none; width: 24px; height: 24px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; transition: background .2s; " + (on ? "background: #B9714B; border: 2px solid #B9714B;" : "background: #FFFFFF; border: 2px solid #CDBFB2;")
      };
    });
    var chosen = picked.length ? picked.slice().sort() : [0, 1, 2, 3];
    var answers = chosen.map(function (i) {
      var fresh = i === last;
      return {
        lead: data[i].lead, rest: data[i].rest,
        style: "display: flex; gap: 14px; align-items: flex-start; padding: 8px 10px; margin: 0 -10px; border-radius: 12px; animation: " + (fresh ? "bsIn .35s ease, bsGlow 1.6s ease" : "none")
      };
    });
    var n = picked.length;
    return {
      worries: worries,
      answers: answers,
      heading: n ? "Here's how we sort that out," : "That's exactly what we sort out,",
      cta: n > 1 ? "Get answers to my " + n + " questions" : (n === 1 ? "Get my answer" : "Get my free plan")
    };
  }
}
</script>
</body>
</html>
