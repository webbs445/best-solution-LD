  -webkit-mask-image: conic-gradient(from 90deg, #000 var(--lr-a), transparent 0);

/* ===== Review pass: one journey card, status ring in its own colours, quiet statuses, compact phone feed ===== */
/* Lead journey carries the count, so its numbers are hero-sized; the range sits on the right of the header. */
.lr-journey__range { margin-left: auto; color: var(--muted); font: 500 var(--fs-small)/1.2 var(--font); }

/* Status: In progress is quiet text with a dot; new, won, lost, junk and duplicate keep their pills. */
.lr-pill[data-quiet] { padding-left: 0 !important; background: none !important; box-shadow: none !important; color: var(--muted); font-weight: 500; }
.lr-pill[data-quiet]::before, .lr-pill[data-new]::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--progress); }

@keyframes lr-ping { from { box-shadow: 0 0 0 0 rgba(204,134,103,.6); } to { box-shadow: 0 0 0 7px rgba(204,134,103,0); } }
.lr-feed tbody tr[data-won] > * { background-color: rgba(14,158,108,.08); }

/* Laptop: the page heading already names the range. */
@media (min-width: 1200px) { .lr-journey__range { display: none; } }
/* Breakdown: the legend sits at the bottom of the card, so a short list leaves space above it, not below. */
.lr-bd__legend { margin-top: auto; }
.lr-bd__panels { margin-bottom: 14px; }
.lr-fcard[data-won] { background: linear-gradient(90deg, rgba(14,158,108,.1), transparent 70%); }

/* Phone lead list: three short lines per lead. */
.lr-fcard { padding: 12px 0; }

.lr-nav__setup { padding: 4px 8px; border-radius: 999px; background: rgba(204,134,103,.14); color: var(--copper-hi); font: 700 10px/1 var(--font); font-style: normal; letter-spacing: .06em; text-transform: uppercase; }

/* Phone: all five range buttons fit on one row, so none is cut off. */
@media (max-width: 767px) {
  .lr-range__chips { justify-content: space-between; }
  .lr-range__chips .lr-chip { gap: 2px; padding: 0 9px; font-size: 12.5px; }
}
@media (prefers-reduced-motion: reduce) { .lr-pill[data-new]::before { animation: none; } }

<!-- Filled in by the server (lib/adsReport.ts): one data object, or { signin: true } for the sign-in page. -->
<script type="application/json" id="lr-data">__LR_DATA__</script>
<script>
(() => {
  "use strict";
  /* In-page navigation: every switch, range chip and state link updates a query held in memory, then re-renders.
     The address bar is updated too when the browser allows it, so links never open a new page or tab. */
  let VQ = null;
  const QS = () => VQ ?? location.search;
  function setQuery(href) {
    VQ = new URL(href, "https://lr.local/" + QS()).search;
    try { history.replaceState(null, "", VQ || "?"); } catch { /* sandboxed preview: keep it in memory */ }
  }

  /* ---------- Helpers ---------- */
  const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ESC[c]);

  /* ==========================================================================
     Calculations (spec §4). Pure functions; the developer ports them unchanged.
     ========================================================================== */
  // 4.1 Status groups. Unknown statuses count as In progress.
  const GROUP_OF = {
    "Deal Won": "won", Converted: "won",
    "Deal Lost": "lost", Unqualified: "lost", "Do Not Contact": "lost",
    Junk: "junk", "Duplicate Lead": "duplicate",
  };
  const groupOf = (status) => GROUP_OF[status] ?? "progress";

  // 4.2 Counts
  function countLeads(leads) {
    const c = { leads: leads.length, won: 0, progress: 0, lost: 0, junk: 0, duplicate: 0, withClickId: 0 };
    for (const l of leads) {
      c[groupOf(l.status)]++;
      if (l.hasGoogleClickId) c.withClickId++;
    }
    c.junkAll = c.junk + c.duplicate;
    c.notJunk = c.leads - c.junkAll;
    c.qualified = c.notJunk - c.lost;
    return c;
  }

  // 4.3 Ratios: a missing, zero or invalid divisor gives null, shown as "–".
  const ratio = (a, b) => (a == null || !b || !Number.isFinite(a) || !Number.isFinite(b) ? null : a / b);

  function erpMetrics(data) {
    const c = countLeads(data.erp.leads);
    const g = data.google;
    const prevQualifiedPct = ratio(data.erp.prevQualifiedCount, data.erp.prevLeadCount);
    return {
      ...c,
      notJunkPct: ratio(c.notJunk, c.leads),
      qualifiedPct: ratio(c.qualified, c.leads),
      winRate: ratio(c.won, c.qualified),
      cpql: g.connected ? ratio(g.totals.cost, c.qualified) : null,
      prevQualifiedPct,
      prevCpql: g.connected && g.prevTotals ? ratio(g.prevTotals.cost, data.erp.prevQualifiedCount) : null,
    };
  }

  function googleMetrics(t) {
    return {
      ctr: ratio(t.clicks, t.impressions),
      cpc: ratio(t.cost, t.clicks),
      cpl: ratio(t.cost, t.formConversions), // D1: spend ÷ Form (tag)
      clickToLead: ratio(t.formConversions, t.clicks),
    };
  }

  // C15 campaign-name rule (D15). level: "campaign" | "adGroup".
  function rowName(lead, data, level) {
    const g = data.google;
    const tag = level === "campaign" ? lead.campaign : lead.adGroup;
    if (g.connected) {
      const camp = g.campaigns.find((c) => c.id === lead.googleCampaignId);
      if (!camp) return { name: "Unmatched", missing: "unmatched" };
      if (level === "campaign") return { name: camp.name, missing: null };
      const ag = camp.adGroups.find((a) => a.id === lead.googleAdGroupId);
      return ag ? { name: ag.name, missing: null } : { name: "No ad group tag", missing: "adGroup" };
    }
    if (tag) return { name: tag, missing: null };
    return level === "campaign" ? { name: "No campaign tag", missing: "campaign" } : { name: "No ad group tag", missing: "adGroup" };
  }

  // Campaigns leaderboard rows with CPQL per campaign (4.3) and the best/worst badges (4.4).
  function campaignRows(data) {
    const rows = new Map();
    for (const l of data.erp.leads) {
      const { name, missing } = rowName(l, data, "campaign");
      const key = data.google.connected ? l.googleCampaignId || "unmatched" : name;
      if (!rows.has(key)) rows.set(key, { key, name, missing, leads: [] });
      rows.get(key).leads.push(l);
    }
    const out = [...rows.values()].map((r) => {
      const c = countLeads(r.leads);
      const camp = data.google.connected ? data.google.campaigns.find((x) => x.id === r.key) : null;
      return { ...r, ...c, qualifiedPct: ratio(c.qualified, c.leads), cpql: camp ? ratio(camp.cost, c.qualified) : null, badge: null };
    });
    out.sort((a, b) => b.leads - a.leads || (b.qualifiedPct ?? -1) - (a.qualifiedPct ?? -1) || a.name.localeCompare(b.name));
    markBestWorst(out, data.google.connected);
    return out;
  }

  function markBestWorst(rows, connected) {
    const eligible = rows.filter((r) => r.leads >= 5 && r.missing !== "unmatched" && r.missing !== "campaign");
    if (eligible.length < 2) return;
    const metric = connected ? (r) => r.cpql : (r) => r.qualifiedPct;
    const lowerIsBetter = connected;
    const cands = eligible.filter((r) => metric(r) != null);
    if (!cands.length) return;
    const tie = (a, b) => b.leads - a.leads || a.name.localeCompare(b.name);
    const sorted = [...cands].sort((a, b) => (lowerIsBetter ? metric(a) - metric(b) : metric(b) - metric(a)) || tie(a, b));
    sorted[0].badge = "best";
    const worst = [...cands].sort((a, b) => (lowerIsBetter ? metric(b) - metric(a) : metric(a) - metric(b)) || tie(a, b))[0];
    if (worst !== sorted[0]) worst.badge = "worst";
  }

  // 4.5 Change arrows. kind: "lead" (lead-based), "google" (Google-only) or "erp". Returns null when hidden.
  const DIRECTION = { cpl: "down", cpc: "down", cpql: "down", spend: "neutral" }; // everything else: up is good
  function arrow(metric, cur, prev, ctx, opts = {}) {
    const { range } = ctx.data;
    if (range.key === "since" || range.prevFrom == null) return null;
    if (range.key === "today" && opts.google) return null; // D13: Google is a part-day today
    if (cur == null || prev == null || prev === 0) return null;
    if (opts.leadBased && (opts.leadsCur < 5 || opts.leadsPrev < 5)) return null;
    if (opts.ownMin && (cur < 5 || prev < 5)) return null; // D30: small counts (e.g. 1 → 2 deals) never show a % change
    const pct = Math.round(((cur - prev) / prev) * 100);
    const dir = pct > 0 ? "up" : pct < 0 ? "down" : "flat";
    const goodWay = DIRECTION[metric] ?? "up";
    const tone = goodWay === "neutral" || dir === "flat" ? "neutral" : dir === goodWay ? "good" : "bad";
    return { pct, dir, tone };
  }

  // 4.5 Partial marker
  function isPartial(ctx, kind) {
    const { range, updated } = ctx.data;
    if (range.key === "today") return kind !== "erp"; // every Google figure (D13)
    return range.to === updated.slice(0, 10) && (kind === "cpl" || kind === "cpql");
  }

  // 4.6 Formatting. Every formatter returns "–" for null, NaN or ±∞.
  const DASH = "–";
  const bad = (n) => n == null || !Number.isFinite(n);
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const short = (n) => (n.toFixed(1).endsWith(".0") ? n.toFixed(0) : n.toFixed(1));
  const fmtCount = (n) => bad(n) ? DASH : n >= 1e6 ? `${short(n / 1e6)}M` : n >= 1e4 ? `${short(n / 1e3)}K` : Math.round(n).toLocaleString("en-US");
  const fmtMoney = (n) => bad(n) ? DASH : `AED ${Math.round(n).toLocaleString("en-US")}`;
  const fmtCpc = (n) => bad(n) ? DASH : `AED ${n.toFixed(2)}`;
  const fmtPct = (r) => bad(r) ? DASH : `${Math.round(r * 100)}%`;
  const fmtPct1 = (r) => bad(r) ? DASH : `${(r * 100).toFixed(1)}%`;
  const dayMonth = (d) => `${Number(d.slice(8, 10))} ${MONTHS[Number(d.slice(5, 7)) - 1]}`;
  const fmtTime = (s) => (s ? `${dayMonth(s)}, ${s.slice(11, 16)}` : DASH);
  const fmtDate = (d) => (d ? `${dayMonth(d)} ${d.slice(0, 4)}` : DASH);
  const fmtRangeLabel = (from, to) =>
    from.slice(5, 7) === to.slice(5, 7) ? `${Number(from.slice(8, 10))}–${dayMonth(to)}` : `${dayMonth(from)} – ${dayMonth(to)}`;

  const DATA = JSON.parse(document.getElementById("lr-data").textContent);

  /* ---------- URL state (spec C1) ---------- */
  const VIEWS = ["google", "erp"];
  const RANGES = ["today", "7d", "30d", "since"];
  function readUrl() {
    const q = new URLSearchParams(QS());
    if (DATA.signin) return { state: 6, data: null, error: DATA.error || "" };
    return readRest(q, 1, DATA.range.key, DATA);
  }
  function readRest(q, state, range, data) {
    // Default view: Google when connected, else ERP.
    const view = VIEWS.includes(q.get("view")) ? q.get("view") : data && !data.google.connected ? "erp" : "google";
    return { state, range, view, data, paused: false, from: data.range.from, to: data.range.to };
  }

  /* ---------- Placeholder (removed section by section) ---------- */
  // attrs places the card in the bento grid, e.g. 'data-lg="8" data-lg-rows="2"' or a class via cls.
  const placeholder = (title, task, tall = false, attrs = "", cls = "") =>
    `<section class="lr-ph${tall ? " lr-ph--tall" : ""}${cls ? ` ${cls}` : ""}" aria-label="${esc(title)}" ${attrs}>
       <h2 class="lr-ph__title">${esc(title)}</h2>
       <span class="lr-ph__meta">Coming in ${esc(task)}</span>
     </section>`;

  /* ---------- Views ---------- */
  /* ---------- Atoms: A7 info hint, A2 change arrow, A3 partial marker ---------- */
  let infoSeq = 0;
  const info = (label, text) => {
    const id = `lr-info-${++infoSeq}`;
    return `<span class="lr-info"><button type="button" class="lr-info__btn" aria-expanded="false" aria-controls="${id}" aria-label="About: ${esc(label)}">${icon("info")}</button><span class="lr-info__pop lr-glass" id="${id}" role="note" hidden>${esc(text)}</span></span>`;
  };

  const PERIOD_WORDS = { today: "yesterday", "7d": "the previous 7 days", "30d": "the previous 30 days", custom: "the previous period" };
  function deltaHtml(a, ctx) {
    if (!a) return "";
    const glyph = a.dir === "up" ? "▲" : a.dir === "down" ? "▼" : "→";
    const words = `${a.dir === "flat" ? "no change" : `${a.dir} ${Math.abs(a.pct)}%`} on ${PERIOD_WORDS[ctx.range] ?? "the previous period"}`;
    return `<span class="lr-delta" data-tone="${a.tone}" role="img" aria-label="${esc(words)}"><span class="lr-delta__glyph" aria-hidden="true">${glyph}</span>${Math.abs(a.pct)}%</span>`;
  }

  const partialHtml = () =>
    `<span class="lr-partial">Partial${info("partial figures", "Today's Google numbers are still coming in (about 3 hours behind).")}</span>`;

  function rangePhrase(ctx) {
    const r = ctx.data.range;
    return {
      today: `Today, ${dayMonth(r.to)}`,
      "7d": `Last 7 days · ${fmtRangeLabel(r.from, r.to)}`,
      "30d": "Last 30 days",
      since: `From start · 12 Oct to ${dayMonth(r.to)}`,
      custom: `${fmtRangeLabel(ctx.from, ctx.to)}`,
    }[ctx.range];
  }

  /* ---------- C5 Hero number ---------- */
  function renderHero(ctx, view, attrs = "") {
    const d = ctx.data;
    let label, num, a = null, partial = false, help;
    if (view === "google") {
      const cur = d.google.totals.formConversions, prev = d.google.prevTotals?.formConversions ?? null;
      label = "Leads reported by Google";
      num = fmtCount(cur);
      a = arrow("leads", cur, prev, ctx, { google: true, leadBased: true, leadsCur: cur, leadsPrev: prev });
      partial = isPartial(ctx, "google");
      help = "Form sends counted by the Google Ads website tag. Repeat and duplicate sends count too.";
    } else {
      const ok = d.erp.available;
      const cur = ok ? d.erp.leads.length : null, prev = d.erp.prevLeadCount;
      label = "Leads in the ERP";
      num = ok ? fmtCount(cur) : DASH;
      a = ok ? arrow("leads", cur, prev, ctx, { leadBased: true, leadsCur: cur, leadsPrev: prev }) : null;
      help = "Google Ads leads that reached the ERP: they carry a Google click ID, or Google ad tags.";
    }
    return `<section class="lr-hero lr-card" aria-label="${esc(label)}" ${attrs}>
      <h2 class="lr-hero__label">${esc(label)}${info(label, help)}</h2>
      <div class="lr-hero__row"><span class="lr-hero__num">${esc(num)}</span>${deltaHtml(a, ctx)}${partial ? partialHtml() : ""}</div>
      <p class="lr-hero__range">${esc(rangePhrase(ctx))}</p>
    </section>`;
  }

  /* ---------- C6 Funnel ---------- */
  // Ribbon between two equal steps: full height at both ends, pinched in the middle (horizontal and vertical versions).
  const RIBBON_H = "M0,0 C30,0 34,24 50,24 C66,24 70,0 100,0 L100,100 C70,100 66,76 50,76 C34,76 30,100 0,100 Z";
  const RIBBON_V = "M0,0 C0,30 24,34 24,50 C24,66 0,70 0,100 L100,100 C100,70 76,66 76,50 C76,34 100,30 100,0 Z";
  const ribbon = (grad) =>
    `<svg class="lr-fn__ribbon lr-fn__ribbon--h" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="${RIBBON_H}" fill="url(#${grad})"/></svg>
     <svg class="lr-fn__ribbon lr-fn__ribbon--v" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="${RIBBON_V}" fill="url(#${grad}v)"/></svg>`;

  function renderFunnel(ctx, attrs) {
    const t = ctx.data.google.totals;
    const m = googleMetrics(t);
    const steps = [["Impressions", t.impressions], ["Clicks", t.clicks], ["Leads", t.formConversions]];
    const rates = [[fmtPct1(m.ctr), "CTR"], [fmtPct1(m.clickToLead), "to lead"]];
    const step = (i) => `<div class="lr-fn__item" data-kind="step">
        <div class="lr-fn__text"><div class="lr-fn__label">${steps[i][0]}</div><div class="lr-fn__value">${esc(fmtCount(steps[i][1]))}</div></div>
        <div class="lr-fn__shape"><div class="lr-fn__block" data-step="${i + 1}"></div></div>
      </div>`;
    const link = (i) => `<div class="lr-fn__item" data-kind="link">
        <div class="lr-fn__text"><span class="lr-rate">${esc(rates[i][0])} <span>${rates[i][1]}</span></span></div>
        <div class="lr-fn__shape">${ribbon(i === 0 ? "lr-g12" : "lr-g23")}</div>
      </div>`;
    const summary = `${fmtCount(t.impressions)} impressions, ${rates[0][0]} click-through to ${fmtCount(t.clicks)} clicks, ${rates[1][0]} of clicks became ${fmtCount(t.formConversions)} leads`;
    return `<section class="lr-card lr-fn-card" aria-labelledby="lr-fn-title" ${attrs}>
      <div class="lr-card__head">
        <h2 class="lr-card__title" id="lr-fn-title">From impressions to leads${info("the funnel", "Steps are drawn the same size, not to scale. The pills show how many moved on to the next step.")}</h2>
        ${isPartial(ctx, "google") ? partialHtml() : ""}
      </div>
      <div class="lr-fn" role="img" aria-label="${esc(summary)}">${step(0)}${link(0)}${step(1)}${link(1)}${step(2)}</div>
    </section>`;
  }

  /* ---------- A8 Sparkline ---------- */
  // values: numbers or null (null breaks the line). One usable point shows a dot.
  function spark(values, label) {
    const pts = values.map((v, i) => [i, v]).filter(([, v]) => v != null && Number.isFinite(v));
    if (pts.length < 2) return `<div class="lr-spark-dot" role="img" aria-label="${esc(label)}"></div>`;
    const vs = pts.map(([, v]) => v), lo = Math.min(...vs), hi = Math.max(...vs);
    const x = (i) => (values.length === 1 ? 50 : (i / (values.length - 1)) * 100);
    const y = (v) => (hi === lo ? 16 : 30 - ((v - lo) / (hi - lo)) * 28); // 2 px headroom top and bottom
    let line = "", prev = null;
    values.forEach((v, i) => {
      if (v == null || !Number.isFinite(v)) { prev = null; return; }
      line += `${prev == null ? "M" : "L"}${x(i).toFixed(1)},${y(v).toFixed(1)} `;
      prev = i;
    });
    const area = `M${x(pts[0][0]).toFixed(1)},32 ${pts.map(([i, v]) => `L${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ")} L${x(pts.at(-1)[0]).toFixed(1)},32 Z`;
    return `<svg class="lr-spark" viewBox="0 0 100 32" preserveAspectRatio="none" role="img" aria-label="${esc(label)}"><path class="lr-spark__area" d="${area}"/><path class="lr-spark__line" d="${line.trim()}"/></svg>`;
  }

  /* ---------- C7 KPI tiles ---------- */
  // Money shows "AED" as a small prefix so the number keeps its size in a small tile.
  const valueHtml = (text) => {
    const m = /^AED (.+)$/.exec(text);
    return m ? `<span class="lr-kpi__cur">AED</span>${esc(m[1])}` : esc(text);
  };
  function renderKpis(ctx) {
    const g = ctx.data.google, t = g.totals, p = g.prevTotals, m = googleMetrics(t), pm = p ? googleMetrics(p) : {};
    const day = (d) => googleMetrics(d);
    const tiles = [
      ["Spend", "spend", t.cost, p?.cost, fmtMoney, g.daily.map((d) => d.cost)],
      ["Cost per lead", "cpl", m.cpl, pm.cpl, fmtMoney, g.daily.map((d) => day(d).cpl)],
      ["Avg CPC", "cpc", m.cpc, pm.cpc, fmtCpc, g.daily.map((d) => day(d).cpc)],
      ["Impressions", "impressions", t.impressions, p?.impressions, fmtCount, g.daily.map((d) => d.impressions)],
      ["Clicks", "clicks", t.clicks, p?.clicks, fmtCount, g.daily.map((d) => d.clicks)],
      ["CTR", "ctr", m.ctr, pm.ctr, fmtPct1, g.daily.map((d) => day(d).ctr)],
    ];
    return tiles.map(([label, key, cur, prev, fmt, series]) => {
      const a = arrow(key, cur, prev ?? null, ctx, { google: true });
      const partial = isPartial(ctx, key === "cpl" ? "cpl" : "google");
      return `<section class="lr-card lr-kpi is-kpi" aria-label="${esc(label)}">
        <h3 class="lr-kpi__label">${esc(label)}</h3>
        <div class="lr-kpi__value">${valueHtml(fmt(cur))}</div>
        <div class="lr-kpi__meta">${deltaHtml(a, ctx)}${partial ? partialHtml() : ""}</div>
        ${spark(series, `${label} per day`)}
      </section>`;
    }).join("");
  }

  /* ---------- C8 Conversion split ---------- */
  function renderSplit(ctx, attrs) {
    const t = ctx.data.google.totals, p = ctx.data.google.prevTotals;
    const item = (label, key, how) => {
      // These are lead counts: the small-count rule applies (D30), same as the Google hero.
      const a = arrow(key, t[key], p?.[key] ?? null, ctx, { google: true, ownMin: true });
      return `<div class="lr-split__item">
        <h3 class="lr-kpi__label">${esc(label)}</h3>
        <div class="lr-split__value">${esc(fmtCount(t[key]))}${deltaHtml(a, ctx)}</div>
        <p class="lr-split__how">${esc(how)}</p>
      </div>`;
    };
    return `<section class="lr-card" aria-labelledby="lr-split-title" ${attrs}>
      <div class="lr-card__head">
        <h2 class="lr-card__title" id="lr-split-title">Google conversions${info("Google conversions", "Two separate counts, never added together. Form (tag) counts the moment a form is sent. Lead (ERP) is imported from the ERP every night, so the latest days look low at first.")}</h2>
        ${isPartial(ctx, "google") ? partialHtml() : ""}
      </div>
      <div class="lr-split">
        ${item("Form (tag)", "formConversions", "Counted when a form is sent")}
        ${item("Lead (ERP)", "erpConversions", "Imported nightly from the ERP")}
      </div>
    </section>`;
  }

  /* ---------- C9 Campaign tree ---------- */
  // UI state lives in memory; a reload resets it (BRIEF §2 allows this).
  const tree = { key: "cost", dir: "desc", open: new Set() };
  const TYPE_LABEL = { SEARCH: "Search", PERFORMANCE_MAX: "Performance Max", DISPLAY: "Display", VIDEO: "Video" };
  const STATUS_LABEL = { ENABLED: "Enabled", PAUSED: "Paused", REMOVED: "Removed" };
  const ctrOf = (r) => ratio(r.clicks, r.impressions);
  const TREE_COLS = [
    { key: "name", label: "Campaign", get: (r) => r.name ?? r.text, sortable: true },
    { key: "status", label: "Status" },
    { key: "type", label: "Type" },
    { key: "impressions", label: "Impr.", num: true, fmt: fmtCount, get: (r) => r.impressions, sortable: true },
    { key: "clicks", label: "Clicks", num: true, fmt: fmtCount, get: (r) => r.clicks, sortable: true },
    { key: "ctr", label: "CTR", num: true, fmt: fmtPct1, get: ctrOf, sortable: true },
    { key: "cost", label: "Spend", num: true, fmt: fmtMoney, get: (r) => r.cost, sortable: true },
    { key: "formConversions", label: "Form (tag)", num: true, fmt: fmtCount, get: (r) => r.formConversions ?? null, sortable: true },
    { key: "erpConversions", label: "Lead (ERP)", num: true, fmt: fmtCount, get: (r) => r.erpConversions ?? null, sortable: true },
  ];
  function sorted(rows) {
    const col = TREE_COLS.find((c) => c.key === tree.key);
    const sign = tree.dir === "asc" ? 1 : -1;
    return [...rows].sort((a, b) => {
      const x = col.get(a), y = col.get(b);
      if (x == null || y == null) return x == null ? 1 : -1; // missing values last
      return (typeof x === "string" ? x.localeCompare(y) : x - y) * sign;
    });
  }

  function treeRow(r, level, extra) {
    const sub = [r.status ? STATUS_LABEL[r.status] ?? r.status : "", extra.typeText ?? ""].filter(Boolean).join(" · ");
    const cells = TREE_COLS.slice(1).map((c) => {
      const sortedAttr = c.key === tree.key ? " data-sorted" : "";
      if (c.key === "status") return `<td data-col="status"${sortedAttr}>${r.status ? `<span class="lr-status" data-s="${esc(r.status)}">${esc(STATUS_LABEL[r.status] ?? r.status)}</span>` : ""}</td>`;
      if (c.key === "type") return `<td data-col="type" class="lr-muted">${esc(extra.typeText ?? "")}</td>`;
      const v = c.get(r);
      return `<td data-num${sortedAttr}>${v == null ? `<span class="lr-muted">${DASH}</span>` : esc(c.fmt(v))}</td>`;
    }).join("");
    return `<tr data-level="${level}" id="${extra.id}"${extra.hidden ? " hidden" : ""}>
      <th scope="row"${tree.key === "name" ? " data-sorted" : ""}><div class="lr-tree__name">${extra.toggle ?? '<span class="lr-tree__spacer"></span>'}${extra.kind ? `<span class="lr-tree__kind">${extra.kind}</span>` : ""}<span class="lr-tree__label"><span>${esc(r.name ?? r.text)}</span>${sub ? `<span class="lr-tree__sub">${esc(sub)}</span>` : ""}</span></div></th>
      ${cells}
    </tr>`;
  }

  /* Phone version of the tree (spec C9, < 768). Same sort and open state as the table. */
  const SORT_OPTIONS = [["cost", "desc", "Spend, high to low"], ["cost", "asc", "Spend, low to high"], ["formConversions", "desc", "Form (tag), most first"],
    ["erpConversions", "desc", "Lead (ERP), most first"], ["clicks", "desc", "Clicks, most first"], ["ctr", "desc", "CTR, highest first"],
    ["impressions", "desc", "Impressions, most first"], ["name", "asc", "Name, A to Z"]];
  function mStats(r, keyword) {
    const cols = keyword ? ["cost", "clicks", "ctr"] : ["cost", "clicks", "ctr", "formConversions", "erpConversions"];
    return `<dl class="lr-mt__stats">${cols.map((k) => {
      const c = TREE_COLS.find((x) => x.key === k), v = c.get(r);
      return `<div${k === tree.key ? " data-sorted" : ""}><dt>${esc(c.label)}</dt><dd>${v == null ? `<span class="lr-muted">${DASH}</span>` : esc(c.fmt(v))}</dd></div>`;
    }).join("")}</dl>`;
  }
  function renderMobileTree(ctx) {
    const more = (id, kidsId, n, word) => {
      const open = tree.open.has(id);
      return `<button type="button" class="lr-btn-ghost lr-mt__more" data-mtoggle="${id}" aria-expanded="${open}" aria-controls="${kidsId}">${open ? "Hide" : "Show"} ${n} ${word}${n > 1 ? "s" : ""}${icon("chevron")}</button>`;
    };
    const items = sorted(ctx.data.google.campaigns).map((c) => {
      const cid = `lr-c-${c.id}`, pmax = c.type === "PERFORMANCE_MAX", word = pmax ? "asset group" : "ad group";
      const ags = sorted(c.adGroups);
      const kids = ags.map((a) => {
        const aid = `lr-a-${a.id}`, kws = c.type === "SEARCH" ? sorted(a.keywords) : [];
        const kwList = kws.length ? `<ul class="lr-mt__kids" id="lr-mk-${a.id}"${tree.open.has(aid) ? "" : " hidden"}>${kws.map((k) =>
          `<li class="lr-mt"><div class="lr-mt__name">${esc(k.text)}</div><div class="lr-mt__sub"><span class="lr-tree__kind">keyword</span></div>${mStats(k, true)}</li>`).join("")}</ul>` : "";
        return `<li class="lr-mt">
          <div class="lr-mt__name">${esc(a.name)}</div>
          <div class="lr-mt__sub"><span class="lr-tree__kind">${word}</span><span class="lr-status" data-s="${esc(a.status)}">${esc(STATUS_LABEL[a.status] ?? a.status)}</span></div>
          ${mStats(a)}
          ${kws.length ? more(aid, `lr-mk-${a.id}`, kws.length, "keyword") : ""}${kwList}
        </li>`;
      }).join("");
      return `<li class="lr-mt">
        <div class="lr-mt__name">${esc(c.name)}</div>
        <div class="lr-mt__sub"><span class="lr-status" data-s="${esc(c.status)}">${esc(STATUS_LABEL[c.status] ?? c.status)}</span><span>· ${esc(TYPE_LABEL[c.type] ?? c.type)}</span></div>
        ${mStats(c)}
        ${ags.length ? more(cid, `lr-mc-${c.id}`, ags.length, word) : ""}
        ${ags.length ? `<ul class="lr-mt__kids" id="lr-mc-${c.id}"${tree.open.has(cid) ? "" : " hidden"}>${kids}</ul>` : ""}
      </li>`;
    }).join("");
    const opts = SORT_OPTIONS.map(([k, d, label]) => `<option value="${k}:${d}"${k === tree.key && d === tree.dir ? " selected" : ""}>${esc(label)}</option>`).join("");
    const custom = SORT_OPTIONS.some(([k, d]) => k === tree.key && d === tree.dir) ? "" : `<option selected>${esc(TREE_COLS.find((c) => c.key === tree.key).label)}, ${tree.dir === "asc" ? "low to high" : "high to low"}</option>`;
    return `<div class="lr-mtree">
      <div class="lr-mtree__bar"><label class="lr-field__label" for="lr-sortsel">Sort by</label><select class="lr-select" id="lr-sortsel" data-sort-select>${custom}${opts}</select></div>
      <ul class="lr-mt-list">${items}</ul>
    </div>`;
  }

  function renderTree(ctx, attrs) {
    const camps = sorted(ctx.data.google.campaigns);
    const toggle = (id, childIds, label) =>
      `<button type="button" class="lr-tree__toggle" data-tree-toggle="${id}" aria-expanded="${tree.open.has(id)}" aria-controls="${childIds.join(" ")}" aria-label="${esc(label)}">${icon("chevron")}</button>`;
    let rows = "";
    for (const c of camps) {
      const cid = `lr-c-${c.id}`, pmax = c.type === "PERFORMANCE_MAX", groupWord = pmax ? "asset group" : "ad group";
      const ags = sorted(c.adGroups);
      rows += treeRow(c, 1, { id: cid, typeText: TYPE_LABEL[c.type] ?? c.type,
        toggle: ags.length ? toggle(cid, ags.map((a) => `lr-a-${a.id}`), `${tree.open.has(cid) ? "Hide" : "Show"} ${ags.length} ${groupWord}${ags.length > 1 ? "s" : ""} of ${c.name}`) : null });
      for (const a of ags) {
        const aid = `lr-a-${a.id}`, kws = c.type === "SEARCH" ? sorted(a.keywords) : [];
        const kwIds = kws.map((_, i) => `lr-k-${a.id}-${i}`);
        rows += treeRow(a, 2, { id: aid, hidden: !tree.open.has(cid), kind: groupWord,
          toggle: kws.length ? toggle(aid, kwIds, `${tree.open.has(aid) ? "Hide" : "Show"} ${kws.length} keyword${kws.length > 1 ? "s" : ""} of ${a.name}`) : null });
        kws.forEach((k, i) => { rows += treeRow(k, 3, { id: kwIds[i], hidden: !(tree.open.has(cid) && tree.open.has(aid)), kind: "keyword" }); });
      }
    }
    const head = TREE_COLS.map((c) => {
      const active = c.key === tree.key;
      const ariaSort = active ? ` aria-sort="${tree.dir === "asc" ? "ascending" : "descending"}" data-sorted` : "";
      const inner = c.sortable
        ? `<button type="button" class="lr-sort" data-sort="${c.key}">${esc(c.label)}<span class="lr-sort__dir" aria-hidden="true">${active ? (tree.dir === "asc" ? "▲" : "▼") : ""}</span></button>`
        : esc(c.label);
      return `<th scope="col" data-col="${c.key}"${c.num ? " data-num" : ""}${ariaSort}>${inner}</th>`;
    }).join("");
    return `<section class="lr-card lr-tree-card" aria-labelledby="lr-tree-title" ${attrs}>
      <div class="lr-card__head">
        <h2 class="lr-card__title" id="lr-tree-title">Campaigns${info("campaigns", "Click a column to sort. Open a campaign to see its ad groups (asset groups for Performance Max), and a Search ad group to see its keywords.")}</h2>
        ${isPartial(ctx, "google") ? partialHtml() : ""}
      </div>
      <div class="lr-tree-wrap" tabindex="0" role="region" aria-label="Campaign table, scrolls sideways on small screens"><table class="lr-tree"><caption class="lr-sr">Google Ads campaigns, sorted by ${esc(TREE_COLS.find((c) => c.key === tree.key).label)}</caption><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>
      ${renderMobileTree(ctx)}
    </section>`;
  }

  /* ---------- C10 Leads and spend per day ---------- */
  // Bars: Google's formConversions only (D18). Line: spend on its own scale. Bars and dots are HTML for crisp edges.
  function renderChart(ctx, attrs) {
    const days = ctx.data.google.daily;
    const n = days.length;
    const maxLeads = Math.max(1, ...days.map((d) => d.formConversions));
    const maxCost = Math.max(1, ...days.map((d) => d.cost));
    const xPct = (i) => ((i + 0.5) / n) * 100;
    const leadPct = (d) => (d.formConversions / maxLeads) * 100;
    const costPct = (d) => (d.cost / maxCost) * 92; // headroom so the line never touches the top label
    const line = n > 1 ? days.map((d, i) => `${i ? "L" : "M"}${xPct(i).toFixed(2)},${(100 - costPct(d)).toFixed(2)}`).join(" ") : "";
    const label = (d, i) => (i === 0 || d.date.slice(8) === "01" ? dayMonth(d.date) : String(Number(d.date.slice(8))));
    const totalLeads = days.reduce((a, d) => a + d.formConversions, 0);
    const summary = n === 1
      ? `${dayMonth(days[0].date)}: ${days[0].formConversions} leads, ${fmtMoney(days[0].cost)} spend`
      : `Leads per day from ${dayMonth(days[0].date)} to ${dayMonth(days.at(-1).date)}: ${totalLeads} in total, most on one day ${maxLeads}. Spend per day up to ${fmtMoney(maxCost)}. Use the arrow keys to read each day.`;
    return `<section class="lr-card" aria-labelledby="lr-chart-title" ${attrs}>
      <div class="lr-card__head">
        <h2 class="lr-card__title" id="lr-chart-title">Leads and spend per day${info("the daily chart", "Bars are leads counted by the Google Ads tag. The line is daily spend, on its own scale (right). Days are UAE days.")}</h2>
        ${isPartial(ctx, "google") ? partialHtml() : ""}
      </div>
      <div class="lr-chart" tabindex="0" role="group" aria-roledescription="chart" aria-label="${esc(summary)}" data-days="${esc(JSON.stringify(days.map((d) => [dayMonth(d.date), d.formConversions, d.cost, leadPct(d), costPct(d)])))}">
        <div class="lr-chart__legend" aria-hidden="true"><span class="lr-chart__key">Leads (Form tag)</span><span class="lr-chart__key lr-chart__key--line">Spend</span></div>
        <div class="lr-chart__plot" aria-hidden="true">
          <span class="lr-chart__ymax">${maxLeads} leads</span><span class="lr-chart__ymax lr-chart__ymax--r">${esc(fmtMoney(maxCost))}</span>
          <div class="lr-chart__area">
            <div class="lr-chart__grid" style="--t:0%"></div><div class="lr-chart__grid" style="--t:50%"></div>
            <div class="lr-chart__bars">${days.map((d) => `<div class="lr-chart__slot"><div class="lr-chart__bar" style="--h:${leadPct(d).toFixed(1)}%"></div></div>`).join("")}</div>
            ${line ? `<svg class="lr-chart__line" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${line}"/></svg>` : ""}
            ${days.map((d, i) => `<span class="lr-chart__dot" style="--x:${xPct(i).toFixed(2)}%;--y:${costPct(d).toFixed(2)}%"></span>`).join("")}
            <div class="lr-chart__tip lr-glass" hidden></div>
          </div>
        </div>
        <span class="lr-sr" aria-live="polite" data-live></span>
        <div class="lr-chart__x" aria-hidden="true">${days.map((d, i) => `<span>${esc(label(d, i))}</span>`).join("")}</div>
        <table class="lr-sr"><caption>Leads and spend per day</caption><thead><tr><th scope="col">Day</th><th scope="col">Leads</th><th scope="col">Spend</th></tr></thead>
          <tbody>${days.map((d) => `<tr><th scope="row">${esc(fmtDate(d.date))}</th><td>${d.formConversions}</td><td>${esc(fmtMoney(d.cost))}</td></tr>`).join("")}</tbody></table>
      </div>
    </section>`;
  }

  /* ---------- C11 Arrival note + C21 Lead journey ---------- */
  function renderJourney(ctx, attrs) {
    const d = ctx.data;
    if (!d.erp.available || !d.erp.leads.length) return ""; // states 3 and 4: C18 / C17 take over (S22, S23)
    const m = erpMetrics(d);
    const lb = { leadBased: true, leadsCur: m.leads, leadsPrev: d.erp.prevLeadCount };
    const small = { ...lb, ownMin: true }; // Qualified and Won also need 5+ themselves (D30)
    const HELP = {
      leads: "Google Ads leads that reached the ERP: they carry a Google click ID, or Google ad tags.",
      qualified: "Every lead except Junk, Duplicate and Lost.",
      won: "Deal Won or Converted.",
    };
    // A won deal is the moment the team cares about most: the Won step lights up (trophy, green glow) when there is one.
    const step = (key, label, value, prev, aKey) => `<div class="lr-journey__step" data-step="${key}"${key === "won" && value > 0 ? " data-hit" : ""}>
        <h3 class="lr-kpi__label">${key === "won" && value > 0 ? icon("trophy") : ""}${label}${info(label, HELP[key])}</h3>
        <div class="lr-journey__value">${esc(fmtCount(value))}</div>
        ${deltaHtml(arrow(aKey, value, prev, ctx, key === "leads" ? lb : small), ctx)}
      </div>`;
    const link = (pct, word) => `<div class="lr-journey__link">${icon("chevron")}<span class="lr-rate">${esc(pct)}<span class="lr-rate__word"> ${esc(word)}</span></span></div>`;
    const arrival = d.google.connected
      ? `<p class="lr-arrival"><b>${m.withClickId}</b> of <b>${d.google.totals.formConversions}</b> from Google arrived${isPartial(ctx, "google") ? partialHtml() : ""}${info("arrivals", "Leads in the ERP with a Google click ID, against the form sends Google counted. Google counts every send, including duplicates and repeat sends, and reports a few hours late, so the two rarely match exactly.")}</p>`
      : "";
    // Cost per qualified lead needs the Google spend: a value once connected, a one-line note until then.
    const cpql = d.google.connected
      ? `<p class="lr-journey__note">Cost per qualified lead <b>${esc(fmtMoney(m.cpql))}</b>${deltaHtml(arrow("cpql", m.cpql, m.prevCpql, ctx, { ...lb, google: true }), ctx)}${isPartial(ctx, "cpql") ? partialHtml() : ""}</p>`
      : `<p class="lr-journey__note">${icon("link")}Cost per qualified lead shows once Google Ads is connected. <a href="${esc(viewHref(ctx, "google"))}">See setup</a></p>`;
    return `<section class="lr-card lr-journey-card" aria-labelledby="lr-journey-title" ${attrs}>
      <div class="lr-card__head"><h2 class="lr-card__title" id="lr-journey-title">Lead journey</h2><span class="lr-journey__range">${esc(rangePhrase(ctx))}</span></div>
      ${arrival}
      <div class="lr-journey">
        ${step("leads", "Leads", m.leads, d.erp.prevLeadCount, "leads")}
        ${link(fmtPct(m.qualifiedPct), "qualified")}
        ${step("qualified", "Qualified", m.qualified, d.erp.prevQualifiedCount, "qualified")}
        ${link(fmtPct(m.winRate), "won")}
        ${step("won", "Won", m.won, d.erp.prevWonCount, "won")}
      </div>
      ${cpql}
    </section>`;
  }

  /* ---------- C13 Status ring ---------- */
  const GROUPS = [["won", "Won"], ["progress", "In progress"], ["lost", "Lost"], ["junk", "Junk"], ["duplicate", "Duplicate"]];
  function renderRing(ctx, attrs) {
    const d = ctx.data;
    if (!d.erp.available || !d.erp.leads.length) return ""; // states 3 and 4: C18 / C17 take over (S22, S23)
    const m = erpMetrics(d);
    const C = 2 * Math.PI * 40, GAP = 0.8; // circle r = 40 in a 100 × 100 box; small gaps between segments
    let offset = 0;
    const segs = GROUPS.map(([g]) => {
      const len = (m[g] / m.leads) * C;
      const seg = len > 0 ? `<circle class="lr-ring__seg" data-g="${g}" cx="50" cy="50" r="40" stroke-dasharray="${Math.max(len - GAP, 0.01).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}"/>` : "";
      offset += len;
      return seg;
    }).join("");
    const pct = (n) => fmtPct(ratio(n, m.leads));
    const summary = `Status of ${m.leads} leads: ` + GROUPS.map(([g, label]) => `${label} ${m[g]} (${pct(m[g])})`).join(", ");
    const wonArrow = arrow("won", m.won, d.erp.prevWonCount, ctx, { leadBased: true, leadsCur: m.leads, leadsPrev: d.erp.prevLeadCount, ownMin: true });
    // Tiles only for groups that have leads; the empty ones share one line. The centre names the largest group, in its colour.
    const [top, topLabel] = GROUPS.reduce((a, b) => (m[b[0]] > m[a[0]] ? b : a));
    const none = GROUPS.filter(([g]) => !m[g]).map(([, label]) => label);
    const legend = GROUPS.filter(([g]) => m[g]).map(([g, label]) => `<li>
        <span class="lr-swatch" data-g="${g}" aria-hidden="true"></span>
        <span class="lr-legend__name">${label}${g === "won" ? deltaHtml(wonArrow, ctx) : ""}</span>
        <span class="lr-legend__count">${m[g]}</span>
        <span class="lr-legend__pct">${pct(m[g])}</span>
      </li>`).join("");
    return `<section class="lr-card" aria-labelledby="lr-ring-title" ${attrs}>
      <div class="lr-card__head"><h2 class="lr-card__title" id="lr-ring-title">Lead status${info("status groups", "Won: Deal Won, Converted. In progress: Lead, Open, Replied, Interested, Followups, Recalled, Opportunity, Quotation and any new status. Lost: Deal Lost, Unqualified, Do Not Contact. Junk: Junk. Duplicate: Duplicate Lead.")}</h2></div>
      <div class="lr-ring-wrap">
        <div class="lr-ring">
          <svg viewBox="0 0 100 100" role="img" aria-label="${esc(summary)}"><circle class="lr-ring__track" cx="50" cy="50" r="40"/>${segs}</svg>
          <div class="lr-ring__centre" data-g="${top}" aria-hidden="true"><span class="lr-ring__pct">${esc(pct(m[top]))}</span><span class="lr-ring__word">${esc(topLabel.toLowerCase())}</span></div>
        </div>
        <ul class="lr-legend" aria-label="Status groups">${legend}</ul>
        ${none.length ? `<p class="lr-legend__none"><span>None yet</span>${none.map((n) => `<b>${esc(n)}</b>`).join("")}</p>` : ""}
      </div>
    </section>`;
  }

  /* ---------- C15 Leaderboards (+ A6 missing-value tags) ---------- */
  const MISSING_HELP = {
    campaign: "These leads arrived without a campaign tag. Add the custom parameter \"campaign\" to the campaign in Google Ads.",
    adGroup: "These leads arrived without an ad group tag. Add the custom parameter \"adgroup\" to the ad group in Google Ads.",
    keyword: "No keyword. That's normal for Performance Max and Display, which don't use keywords.",
    unmatched: "The click didn't match a current Google campaign, for example after a campaign was renamed.",
  };
  const missingTag = (name, kind) => `<span class="lr-missing">${esc(name)}${info(name, MISSING_HELP[kind])}</span>`;
  const BOARD_TOP = 6;

  // Generic rows for a board: pick(lead) → { key, name, missing, sub }.
  function boardRows(leads, pick) {
    const map = new Map();
    for (const l of leads) {
      const p = pick(l);
      if (!map.has(p.key)) map.set(p.key, { ...p, leads: [] });
      map.get(p.key).leads.push(l);
    }
    return [...map.values()].map((r) => {
      const c = countLeads(r.leads);
      return { ...r, ...c, qualifiedPct: ratio(c.qualified, c.leads) };
    }).sort((a, b) => b.leads - a.leads || (b.qualifiedPct ?? -1) - (a.qualifiedPct ?? -1) || a.name.localeCompare(b.name));
  }

  function qbar(r) {
    const parts = [["qualified", r.qualified], ["lost", r.lost], ["junk", r.junk], ["duplicate", r.duplicate]].filter(([, n]) => n > 0);
    const label = `${r.qualified} qualified, ${r.lost} lost, ${r.junk} junk, ${r.duplicate} duplicate`;
    return `<div class="lr-qbar" role="img" aria-label="${esc(label)}">${parts.map(([g, n]) => `<span data-g="${g}" style="--n:${n}"></span>`).join("")}</div>`;
  }

  function boardCard(id, title, help, rows, attrs, cls, rowExtra, headExtra = "") {
    const items = rows.map((r, i) => `<li class="lr-board__row"${i >= BOARD_TOP ? " hidden" : ""}>
        <div class="lr-board__top">
          <span class="lr-board__name">${r.missing ? missingTag(r.name, r.missing) : esc(r.name)}${rowExtra?.badge?.(r) ?? ""}${r.sub ? `<span class="lr-board__sub">${esc(r.sub)}</span>` : ""}</span>
          <span class="lr-board__leads">${r.leads} <span>lead${r.leads === 1 ? "" : "s"}</span></span>
        </div>
        ${qbar(r)}
        <div class="lr-board__meta"><span><b>${esc(fmtPct(r.qualifiedPct))}</b> qualified</span>${rowExtra?.meta?.(r) ?? ""}</div>
      </li>`).join("");
    const more = rows.length > BOARD_TOP
      ? `<button type="button" class="lr-btn-ghost lr-board__more" data-board-more aria-expanded="false" aria-controls="${id}-list">Show all (${rows.length})${icon("chevron")}</button>` : "";
    return `<section class="lr-card${cls ? ` ${cls}` : ""}" aria-labelledby="${id}-title" ${attrs}>
      <div class="lr-card__head"><h2 class="lr-card__title" id="${id}-title">${esc(title)}${info(title, help)}</h2>${headExtra}</div>
      <ul class="lr-board__list" id="${id}-list">${items}</ul>${more}
    </section>`;
  }

  function renderBoards(ctx) {
    const d = ctx.data;
    if (!d.erp.available || !d.erp.leads.length) return ""; // states 3 and 4: C18 / C17 take over (S22, S23)
    const g = d.google;
    const camps = campaignRows(d);
    const campName = (l) => (g.connected ? g.campaigns.find((c) => c.id === l.googleCampaignId)?.name : l.campaign) || "";
    const campaignsCard = boardCard("lr-b-camp", "Campaigns", "Leads per campaign and how good they are. Best and worst compare cost per qualified lead (or qualified share before Google is connected), among campaigns with 5 or more leads.",
      camps, 'data-lg="7"', "", {
        badge: (r) => (r.badge ? `<span class="lr-badge" data-b="${r.badge}">${r.badge === "best" ? "Best" : "Worst"}<span class="lr-sr"> ${g.connected ? (r.badge === "best" ? "lowest" : "highest") + " cost per qualified lead" : (r.badge === "best" ? "highest" : "lowest") + " qualified share"}</span></span>` : ""),
        // Google off: the cell stays, showing "–" (state table row 2); the quality card carries the Connect link.
        meta: (r) => `<span>Won <b>${r.won}</b></span><span>Cost per qualified <b>${esc(fmtMoney(g.connected ? r.cpql : null))}</b></span>`,
      }, g.connected && isPartial(ctx, "cpql") ? partialHtml() : "");
    const adGroups = boardRows(d.erp.leads, (l) => {
      const n = rowName(l, d, "adGroup");
      // Every missing-tag lead of one kind lands in a single row (no campaign underneath it).
      if (n.missing) return { key: `missing-${n.missing}`, name: n.name, missing: n.missing, sub: "" };
      return { key: g.connected ? l.googleAdGroupId : `${l.campaign}|${n.name}`, name: n.name, missing: null, sub: campName(l) };
    });
    const keywords = boardRows(d.erp.leads, (l) => (l.keyword ? { key: l.keyword, name: l.keyword, missing: null } : { key: "", name: "No keyword", missing: "keyword" }));
    const pages = boardRows(d.erp.leads, (l) => ({ key: l.form || "", name: l.form || "Unknown form", missing: null }));
    return [
      campaignsCard,
      boardCard("lr-b-ag", "Ad groups", "Leads per ad group (asset group for Performance Max), with the campaign underneath.", adGroups, 'data-lg="4"', "is-half"),
      boardCard("lr-b-kw", "Keywords", "Leads per search keyword.", keywords, 'data-lg="4"', "is-half"),
      boardCard("lr-b-pg", "Forms", "Which website form the lead was sent from.", pages, 'data-lg="4"', ""), // tablet: full width (no orphan half)
    ].join("");
  }

  /* ---------- A4 status pill, A5 import badge ---------- */
  // Most leads are simply being worked, so In progress is quiet text; the exceptions keep a coloured pill:
  // a new lead nobody has answered yet (copper), Won, Lost, Junk and Duplicate.
  const NEW_STATUSES = ["Lead", "Open"];
  const pill = (status) => {
    const g = groupOf(status);
    const lead = g === "won" ? icon("trophy") : g === "lost" ? icon("x") : g === "duplicate" ? icon("copy") : "";
    const tone = g !== "progress" ? "" : NEW_STATUSES.includes(status) ? " data-new" : " data-quiet";
    return `<span class="lr-pill" data-g="${g}"${tone}>${lead}${esc(status || DASH)}</span>`;
  };
  const importBadge = `<span class="lr-import">Counts in Google Ads</span>`;

  /* ---------- C16 Lead feed ---------- */
  // Filter state lives in memory; only the rows, count and buttons update, so typing in search keeps focus.
  const feed = { q: "", group: "all", limit: 25 };
  const FEED_STEP = 25;
  const FEED_GROUPS = [["all", "All"], ...GROUPS];
  const feedCell = (n) => (n.missing ? `<span class="lr-missing">${esc(n.name)}</span>` : esc(n.name));
  function feedRow(l, d) {
    const camp = rowName(l, d, "campaign"), ag = rowName(l, d, "adGroup");
    const kw = l.keyword ? { name: l.keyword } : { name: "No keyword", missing: "keyword" };
    return { l, hay: [l.leadNo, camp.name, ag.name, kw.name, l.form, l.status].join(" ").toLowerCase(), camp, ag, kw };
  }
  function feedState(ctx) {
    const d = ctx.data;
    const all = [...d.erp.leads].sort((a, b) => b.created.localeCompare(a.created)).map((l) => feedRow(l, d));
    const q = feed.q.trim().toLowerCase();
    const match = all.filter((r) => (feed.group === "all" || groupOf(r.l.status) === feed.group) && (!q || r.hay.includes(q)));
    const shown = match.slice(0, feed.limit);
    const filtered = Boolean(q) || feed.group !== "all";
    const count = filtered ? `Showing ${shown.length} of ${match.length} matching (${all.length} total)` : `Showing ${shown.length} of ${all.length}`;
    const groupCounts = Object.fromEntries(FEED_GROUPS.map(([g]) => [g, g === "all" ? all.length : all.filter((r) => groupOf(r.l.status) === g).length]));
    return { all, match, shown, count, groupCounts, more: match.length > shown.length };
  }
  const feedRowsHtml = (rows) => rows.map(({ l, camp, ag, kw }) => `<tr${groupOf(l.status) === "won" ? " data-won" : ""}>
      <th scope="row"><span class="lr-feed__lead">${esc(l.leadNo)}${l.hasGoogleClickId ? importBadge : ""}</span></th>
      <td>${esc(fmtTime(l.created))}</td>
      <td>${feedCell(camp)}</td><td>${feedCell(ag)}</td><td>${feedCell(kw)}</td>
      <td>${esc(l.form || DASH)}</td>
      <td>${pill(l.status)}</td>
    </tr>`).join("");

  // Phone: three short lines per lead (number and status; keyword and time; campaign, ad group and form), not a labelled grid.
  const feedCardsHtml = (rows) => rows.map(({ l, camp, ag, kw }) => `<li class="lr-fcard"${groupOf(l.status) === "won" ? " data-won" : ""}>
      <div class="lr-fcard__top"><b class="lr-fcard__no">${esc(l.leadNo)}</b>${pill(l.status)}</div>
      <p class="lr-fcard__kw"><span>${feedCell(kw)}</span><time>${esc(fmtTime(l.created))}</time></p>
      <p class="lr-fcard__sub"><span class="lr-sr">Campaign </span>${feedCell(camp)} · ${feedCell(ag)} · ${esc(l.form || DASH)}${l.hasGoogleClickId ? importBadge : ""}</p>
    </li>`).join("");

  function renderFeed(ctx, attrs) {
    const d = ctx.data;
    if (!d.erp.available || !d.erp.leads.length) return ""; // states 3 and 4: C18 / C17 take over (S22, S23)
    const s = feedState(ctx);
    const chips = FEED_GROUPS.map(([g, label]) => `<button type="button" class="lr-fchip" data-fgroup="${g}" aria-pressed="${feed.group === g}">${esc(label)} <span>${s.groupCounts[g]}</span></button>`).join("");
    return `<section class="lr-card lr-feed-card" aria-labelledby="lr-feed-title" ${attrs}>
      <div class="lr-card__head"><h2 class="lr-card__title" id="lr-feed-title">New leads${info("the lead feed", "Newest first. \"Counts in Google Ads\" means the lead has a Google click ID, so tonight's file reports it to Google Ads as a conversion; whether Google accepts it isn't known here. No names, phone numbers or emails are shown.")}</h2></div>
      <div class="lr-feed__controls">
        <label class="lr-search"><span class="lr-sr">Search leads</span>${icon("search")}<input class="lr-input" type="search" data-feed-q value="${esc(feed.q)}" placeholder="Search leads, campaigns…" autocomplete="off"></label>
        <div class="lr-fchips" role="group" aria-label="Filter by status">${chips}</div>
      </div>
      <div class="lr-feed-wrap" tabindex="0" role="region" aria-label="Lead table, scrolls sideways on small screens"><table class="lr-feed">
        <caption class="lr-sr">Google Ads leads, newest first</caption>
        <thead><tr><th scope="col">Lead</th><th scope="col">Received (UAE)</th><th scope="col">Campaign</th><th scope="col">Ad group</th><th scope="col">Keyword</th><th scope="col">Form</th><th scope="col">Status</th></tr></thead>
        <tbody data-feed-rows>${feedRowsHtml(s.shown)}</tbody>
      </table></div>
      <ul class="lr-fcards" data-feed-cards aria-label="Google Ads leads, newest first">${feedCardsHtml(s.shown)}</ul>
      <div class="lr-feed__empty" data-feed-empty${s.match.length ? " hidden" : ""}><p>No lead matches that filter.</p><button type="button" class="lr-btn-ghost" data-feed-clear>Clear filters</button></div>
      <div class="lr-feed__foot"><span data-feed-count role="status">${esc(s.count)}</span><button type="button" class="lr-btn-ghost" data-feed-more${s.more ? "" : " hidden"}>Show ${FEED_STEP} more</button></div>
    </section>`;
  }

  function updateFeed() {
    const card = document.querySelector(".lr-feed-card");
    if (!card) return;
    const s = feedState(readUrl());
    card.querySelector("[data-feed-rows]").innerHTML = feedRowsHtml(s.shown);
    card.querySelector("[data-feed-cards]").innerHTML = feedCardsHtml(s.shown);
    card.querySelector("[data-feed-count]").textContent = s.count;
    card.querySelector("[data-feed-more]").hidden = !s.more;
    card.querySelector("[data-feed-empty]").hidden = s.match.length > 0;
    card.querySelectorAll("[data-fgroup]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.fgroup === feed.group)));
  }

  /* ---------- C17 Empty state: radar ---------- */
  function renderRadar(ctx, attrs) {
    const d = ctx.data;
    if (!d.erp.available || d.erp.leads.length) return "";
    const q = new URLSearchParams(QS());
    ["from", "to"].forEach((k) => q.delete(k));
    q.set("range", "since");
    const action = ctx.range === "since"
      ? `<a class="lr-btn-ghost" href="${esc(viewHref(ctx, "google"))}">See Google leads</a>`
      : `<a class="lr-btn-ghost" href="?${esc(String(q))}">Try a longer range</a>`;
    return `<section class="lr-card lr-empty" aria-labelledby="lr-empty-title" ${attrs}>
      <div class="lr-radar" aria-hidden="true"><span class="lr-radar__sweep"></span><span class="lr-radar__dot"></span></div>
      <h2 class="lr-empty__title" id="lr-empty-title">Listening for the first Google Ads lead</h2>
      <p class="lr-empty__lead">New leads appear here within minutes of reaching the ERP.</p>
      ${action}
    </section>`;
  }

  /* ---------- C18 Error card: replaces the whole ERP view ---------- */
  const renderErpError = () => `<section class="lr-card lr-empty" role="alert" aria-labelledby="lr-error-title">
      <span class="lr-error__icon" aria-hidden="true">${icon("alert")}</span>
      <h2 class="lr-empty__title" id="lr-error-title">The ERP isn't answering</h2>
      <p class="lr-empty__lead">Google numbers still work. Your leads are safe in the ERP.</p>
      <button type="button" class="lr-btn-ghost" data-action="refresh">${icon("refresh")}Retry</button>
    </section>`;

  /* ---------- C12 Setup checklist ---------- */
  const SETUP_STEPS = [["managerAccount", "Manager account"], ["developerToken", "Developer token approved"], ["cloudSignIn", "Google Cloud sign-in"], ["keysAdded", "Keys added"]];
  function renderSetup(ctx) {
    const setup = ctx.data.google.setup;
    const done = SETUP_STEPS.filter(([k]) => setup[k]).length;
    const steps = SETUP_STEPS.map(([k, label]) => `<li class="lr-step"${setup[k] ? " data-done" : ""}>
        <span class="lr-step__mark" aria-hidden="true">${icon("tick")}</span>
        <span class="lr-step__text">${esc(label)}</span>
        <span class="lr-step__state">${setup[k] ? "Done" : "To do"}</span>
      </li>`).join("");
    return `<section class="lr-card lr-setup" aria-labelledby="lr-setup-title">
      <div class="lr-setup__inner">
        <span class="lr-setup__icon" aria-hidden="true">${icon("link")}</span>
        <h2 class="lr-setup__title" id="lr-setup-title">Google Ads not connected yet</h2>
        <p class="lr-setup__lead">Leads still arrive in the ERP status view.</p>
        <p class="lr-setup__count">${done} of ${SETUP_STEPS.length} steps done</p>
        <ol class="lr-steps">${steps}</ol>
        <a class="lr-btn" href="${esc(viewHref(ctx, "erp"))}">Open ERP status</a>
      </div>
    </section>`;
  }

  /* Bento layout per view (laptop 12 columns): hero wide/tall, KPI tiles small. */
  const renderGoogle = (ctx) => !ctx.data.google.connected
    ? renderSetup(ctx)
    : [
    // Laptop: hero and the conversion split stack in the left 4 columns beside a 2-row funnel (S27).
    renderHero(ctx, "google", 'data-lg="4"'),
    renderFunnel(ctx, 'data-lg="8" data-lg-rows="2"'),
    renderSplit(ctx, 'data-lg="4"'),
    renderKpis(ctx),
    renderChart(ctx, ""),
    renderTree(ctx, ""),
  ].join("");

  // The journey carries the lead count, qualified share and cost per qualified lead, so the separate Leads hero and
  // Lead quality cards (which repeated those numbers) are gone from this view.
  const renderErp = (ctx) => !ctx.data.erp.available ? renderErpError() : [
    renderJourney(ctx, ""),
    renderRadar(ctx, ""),

  const RANGE_START = "2026-10-12";

  // Client-side check for the Custom form. Returns the error text, or "" when the range is fine.
  function customError(from, to, today) {
    if (!from || !to) return "Choose both dates.";
    if (from < RANGE_START) return "Counting starts on 12 Oct 2026. Pick a later start date.";
    if (to > today) return "The end date can't be in the future.";
    if (to < from) return "The end date must be on or after the start date.";

  /* Range changes are in-page: every Google lead since the start is already in DATA.erp.all, so a chip or Apply

  const daysIn = (from, to) => (Date.parse(to) - Date.parse(from)) / 86400000 + 1;
  function reportRange(q, today) {
    const from = q.get("from"), to = q.get("to");
    const isDate = (v) => /^\d{4}-\d{2}-\d{2}$/.test(v ?? "") && !Number.isNaN(Date.parse(v));
    const custom = isDate(from) && isDate(to) && !customError(from, to, today);
    const key = custom ? "custom" : ["today", "7d", "30d"].find((k) => k === q.get("range")) ?? "since";
    if (key === "since") return { key, from: RANGE_START, to: today, prevFrom: null, prevTo: null };
    const start = custom ? from : addDays(today, key === "today" ? 0 : key === "7d" ? -6 : -29);
    const end = custom ? to : today;
    const prevFrom = addDays(start, -daysIn(start, end));

    return prevFrom < RANGE_START ? { key, from: start, to: end, prevFrom: null, prevTo: null } : { key, from: start, to: end, prevFrom, prevTo: addDays(start, -1) };

    const count = (groups) => prev && prev.filter((l) => groups.includes(groupOf(l.status))).length;

  /* ---------- S29 Auto-refresh (spec C1, BRIEF §2, D14) ---------- */
  const REFRESH_MS = 15 * 60_000; // 15 minutes (owner, 13 Oct)

  const SCROLL_KEY = "lr-scroll";

    tree.open.size > 0 || !(tree.key === "cost" && tree.dir === "desc") ||

              <path d="M300,${Y}V${b(0)}M600,${Y}V${b(1)}" stroke="rgba(255,255,255,.35)" stroke-dasharray="3 5" vector-effect="non-scaling-stroke"/>
            </g>
          </svg>${labels}${drops}</div>`);
      }
      document.querySelectorAll(".lr-chart__tip").forEach((tip) => {
        if (tip.hidden || tip.querySelector(".tk")) return;
        const b = tip.querySelector("b"); if (!b) return;
        const rest = tip.textContent.slice(b.textContent.length).split(" · ");
        if (rest.length !== 2) return;
        const e = (t) => t.replace(/[<&]/g, "");
        tip.innerHTML = `<b>${e(b.textContent)}</b><span class="tr"><i class="tk"></i>${e(rest[0])}</span><span class="tr"><i class="tk s"></i>${e(rest[1])} spend</span>`;
      });
      // ERP polish: mini rings on quality %, share bars in the status legend.
      document.querySelectorAll('.lr-quality__item[data-k="notjunk"], .lr-quality__item[data-k="qualified"]').forEach((it) => {
        if (it.querySelector(".lr-qring")) return;
        const v = parseFloat(it.querySelector(".lr-quality__value")?.textContent); if (!Number.isFinite(v)) return;
        const C = 2 * Math.PI * 22, off = C * (1 - Math.min(Math.max(v, 0), 100) / 100);
        it.insertAdjacentHTML("beforeend", `<svg class="lr-qring" viewBox="0 0 56 56" aria-hidden="true"><defs>
          <linearGradient id="lr-qg1" x1="0" x2="1"><stop offset="0" stop-color="#34c792"/><stop offset="1" stop-color="#0e9e6c"/></linearGradient>
          <linearGradient id="lr-qg2" x1="0" x2="1"><stop offset="0" stop-color="#f0ab8a"/><stop offset="1" stop-color="#b06a4c"/></linearGradient></defs>
          <circle class="t" cx="28" cy="28" r="22"/><circle class="v" cx="28" cy="28" r="22" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" data-off="${off.toFixed(1)}"/></svg>`);
        const ring = it.querySelector(".lr-qring .v");
        requestAnimationFrame(() => requestAnimationFrame(() => { ring.style.strokeDashoffset = ring.dataset.off; }));
      });
      const COL = { won: "var(--won)", progress: "var(--progress)", lost: "var(--lost)", junk: "var(--junk)", duplicate: "repeating-linear-gradient(45deg, var(--duplicate) 0 3px, rgba(134,98,222,.35) 3px 6px)" };
      document.querySelectorAll(".lr-legend li").forEach((li) => {
        if (li.querySelector(".lr-legend__bar")) return;
        const g = li.querySelector(".lr-swatch")?.dataset.g, p = parseFloat(li.querySelector(".lr-legend__pct")?.textContent);
        if (!g || !Number.isFinite(p)) return;
        li.insertAdjacentHTML("beforeend", `<span class="lr-legend__bar" aria-hidden="true"><i style="--w:${p}%;--c:${COL[g]}"></i></span>`);
      });
      // ERP: fold the four board cards into one tabbed "Breakdown" card.
      const boards = [...document.querySelectorAll("#lr-view > section.lr-card")].filter((s) => s.querySelector(":scope > .lr-board__list"));
      if (boards.length > 1 && !document.querySelector(".lr-bd")) {
        const card = document.createElement("section");
        card.className = "lr-card lr-bd"; card.setAttribute("data-lg", "7"); card.setAttribute("aria-label", "Lead breakdown");
        boards[0].before(card);
        const names = boards.map((b) => (b.querySelector(".lr-card__title")?.childNodes[b.querySelector(".lr-card__title .lr-tic") ? 1 : 0]?.textContent || "").trim());
        const key = (n) => n.toLowerCase().replace(/[^a-z]+/g, "-");
        if (!names.map(key).includes(bdTab)) bdTab = key(names[0]);
        const head = `<div class="lr-card__head"><h2 class="lr-card__title"><span class="lr-tic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg></span>Lead breakdown</h2></div>`;
        const tabs = names.map((n, i) => `<button type="button" class="lr-bd__tab" role="tab" data-bd="${key(n)}" aria-selected="${key(n) === bdTab}">${n.replace(/[<&]/g, "")}<b>${boards[i].querySelectorAll(".lr-board__row").length}</b></button>`).join("");
        card.innerHTML = `${head}<div class="lr-bd__tabs" role="tablist" aria-label="Breakdown by">${tabs}</div>
          <div class="lr-bd__colhead" aria-hidden="true"><span>Name</span><span>Quality mix</span><span>Leads</span></div><div class="lr-bd__panels"></div>
          <div class="lr-bd__legend" aria-hidden="true"><span><i style="--c:var(--won)"></i>Qualified</span><span><i style="--c:#b9c1cc"></i>Lost</span><span><i style="--c:var(--junk)"></i>Junk</span><span><i style="--c:repeating-linear-gradient(45deg,var(--duplicate) 0 2px,#fff 2px 4px)"></i>Duplicate</span></div>`;
        const panels = card.querySelector(".lr-bd__panels");
        boards.forEach((b, i) => {
          const p = document.createElement("div"); p.className = "lr-bd__panel" + (key(names[i]) === bdTab ? " on" : ""); p.setAttribute("role", "tabpanel"); p.dataset.bd = key(names[i]);
          b.removeAttribute("data-lg"); b.classList.remove("is-half"); p.append(b); panels.append(p);
        });
      }
      // ---- Premium pass ----
      const IC = {
        user: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
        check: '<path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4 12 14l-3-3"/>',
        filter: '<path d="M22 3H2l8 9.5V19l4 2v-8.5z"/>',
        pulse: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
        target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
        route: '<circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/>',
        shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/>',
        pie: '<path d="M21.2 15.9A10 10 0 1 1 8 2.8"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>',
        layers: '<path d="M12 2 2 7l10 5 10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>',
        key: '<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/>',
        file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
        inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1"/>',
        db: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/>',
        wallet: '<path d="M20 12V8H6a2 2 0 0 1 0-4h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>',
        tag: '<path d="M12 2H2v10l9.3 9.3a1 1 0 0 0 1.4 0l8.6-8.6a1 1 0 0 0 0-1.4z"/><circle cx="7" cy="7" r="1.5"/>',
        mouse: '<path d="m3 3 7 19 2.5-7.5L20 12z"/>',
        eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12"/><circle cx="12" cy="12" r="3"/>',
        percent: '<path d="M19 5 5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
      };
      const TITLE_IC = [["leads reported", "user"], ["leads in the erp", "db"], ["google conversions", "check"], ["impressions to leads", "filter"],
        ["per day", "pulse"], ["campaigns", "target"], ["journey", "route"], ["quality", "shield"], ["status", "pie"], ["ad groups", "layers"],
        ["keywords", "key"], ["forms", "file"], ["new leads", "inbox"]];
      const KPI_IC = { "spend": "wallet", "cost per lead": "tag", "avg cpc": "mouse", "impressions": "eye", "clicks": "mouse", "ctr": "percent" };
      const chip = (k) => `<span class="lr-tic" aria-hidden="true"><svg viewBox="0 0 24 24">${IC[k]}</svg></span>`;
      document.querySelectorAll(".lr-card__title, .lr-hero__label").forEach((h) => {
        if (h.querySelector(".lr-tic")) return;
        const t = h.textContent.toLowerCase(), m = TITLE_IC.find(([s]) => t.includes(s)); if (m) h.insertAdjacentHTML("afterbegin", chip(m[1]));
      });
      document.querySelectorAll(".lr-kpi > .lr-kpi__label").forEach((h) => {
        if (h.querySelector(".lr-tic")) return; const k = KPI_IC[h.textContent.trim().toLowerCase()]; if (k) h.insertAdjacentHTML("afterbegin", chip(k));
      });
      // Google hero: trend of daily leads behind the number + best day.
      const chartEl = document.querySelector(".lr-chart[data-days]");
      document.querySelectorAll(".lr-hero").forEach((hero) => {
        if (hero.dataset.pro) return; hero.dataset.pro = "1";
        if (chartEl && viewKey() === "google") {
          let days = []; try { days = JSON.parse(chartEl.dataset.days); } catch { /* ignore */ }
          if (days.length > 1) {
            const mx = Math.max(1, ...days.map((d) => d[1]));
            const pts = days.map((d, i) => `${i ? "L" : "M"}${(i / (days.length - 1) * 100).toFixed(2)},${(96 - d[1] / mx * 80).toFixed(2)}`).join(" ");
            const r = smooth(pts)[0];
            hero.insertAdjacentHTML("beforeend", `<svg class="lr-hero__trend" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="lr-ht-f" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e09a78" stop-opacity=".28"/><stop offset="1" stop-color="#e09a78" stop-opacity="0"/></linearGradient></defs><path class="f" d="${r.d} L100,100 L0,100 Z"/><path class="l" d="${r.d}"/></svg>`);
            const best = days.reduce((a, d) => (d[1] > a[1] ? d : a), days[0]);
            hero.querySelector(".lr-hero__range")?.insertAdjacentHTML("afterend", `<p class="lr-hero__insight"><i>★</i>Best day <b>${String(best[0]).replace(/[<&]/g, "")}</b> with <b>${best[1]} leads</b></p>`);
          }
        }
      });
      // Google conversions: how much of the form count the ERP has imported so far.
      document.querySelectorAll(".lr-split").forEach((sp) => {
        if (sp.querySelector(".lr-split__match")) return;
        const v = [...sp.querySelectorAll(".lr-split__value")].map((e) => parseFloat(e.textContent.replace(/,/g, "")));
        if (!(v[0] > 0) || !Number.isFinite(v[1])) return;
        const p = Math.min(100, v[1] / v[0] * 100);
        sp.insertAdjacentHTML("beforeend", `<div class="lr-split__match" aria-hidden="true"><p><span>Imported to the ERP so far</span><b>${Math.round(p)}%</b></p><div class="bar"><i style="--w:${p.toFixed(1)}%"></i></div></div>`);
      });
      // Campaign table: spend share bar under each spend value.
      document.querySelectorAll(".lr-tree").forEach((tb) => {
        const ths = [...tb.querySelectorAll("thead th")], ci = ths.findIndex((th) => th.dataset.col === "cost"); if (ci < 0) return;
        const rows = [...tb.querySelectorAll('tbody tr[data-level="1"]')];
        const val = (tr) => parseFloat((tr.children[ci]?.textContent || "").replace(/[^\d.]/g, "")) || 0;
        const mx = Math.max(1, ...rows.map(val));
        rows.forEach((tr) => { const td = tr.children[ci]; if (!td || td.querySelector(".lr-spendbar")) return; td.insertAdjacentHTML("beforeend", `<span class="lr-spendbar" aria-hidden="true"><i style="--w:${(val(tr) / mx * 100).toFixed(1)}%"></i></span>`); });
      });
      // Daily chart v3: copper tide connecting the lead orbs.
      document.querySelectorAll(".lr-chart__area").forEach((area) => {
        if (area.querySelector(".lr-lead-area")) return;
        const bars = [...area.querySelectorAll(".lr-chart__bar")]; if (bars.length < 2) return;
        const pts = bars.map((b, i) => `${i ? "L" : "M"}${(((i + .5) / bars.length) * 100).toFixed(2)},${(100 - parseFloat(b.style.getPropertyValue("--h"))).toFixed(2)}`).join(" ");
        const r = smooth(pts)[0]; if (!r) return;
        area.insertAdjacentHTML("afterbegin", `<svg class="lr-lead-area" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <defs><linearGradient id="lr-lead-fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e09a78" stop-opacity=".42"/><stop offset="1" stop-color="#e09a78" stop-opacity="0"/></linearGradient>
          <linearGradient id="lr-lead-stroke" x1="0" x2="1"><stop offset="0" stop-color="#f2b99b"/><stop offset=".5" stop-color="#cc8667"/><stop offset="1" stop-color="#a85f42"/></linearGradient></defs>
          <path class="lr-lead-fill" d="${r.d} L${r.last[0]},100 L${r.first[0]},100 Z"/><path class="lr-lead-top" d="${r.d}"/></svg>`);
      });
      const view = document.getElementById("lr-view"); if (!view) return;
      const key = viewKey(), rk = rangeKey();
      // A new range in the same view: the numbers count up to their new values; the cards stay put.
      if (key === shownKey) { if (rk !== shownRange) { shownRange = rk; if (!calm()) countUp(document); } return; }
      shownKey = key; shownRange = rk;
      if (calm()) return;
      [...view.children].forEach((c, i) => c.style.setProperty("--pi", String(Math.min(i, 12))));
      view.querySelectorAll(".lr-chart__bar").forEach((b, i) => b.style.setProperty("--bi", String(i)));
      view.querySelectorAll(".lr-feed tbody tr").forEach((r, i) => r.style.setProperty("--ri", String(i)));
      view.classList.remove("lr-reveal"); view.classList.add("lr-anim");
      countUp(document);
      setTimeout(() => view.classList.remove("lr-anim"), 3000);
    }
    document.addEventListener("click", (e) => {
      const n = e.target.closest(".lr-nav__item"); if (!n || e.metaKey || e.ctrlKey) return;
      e.preventDefault(); document.querySelector(`.lr-switch__side[data-view="${n.dataset.view}"]`)?.click();
    });
    const root = document.getElementById("lr-root");
    if (root) new MutationObserver(() => onRender()).observe(root, { childList: true, subtree: true });
    onRender();
  })();
})();
</script>
</body>
</html>
